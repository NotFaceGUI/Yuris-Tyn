[workspace]
resolver = "2"
members = [
    "crates/yuris-core",
    "crates/yuris-log",
    "crates/yuris-format",
    "crates/yuris-value",
    "crates/yuris-script",
    "crates/yuris-expr",
    "crates/yuris-vm",
    "crates/yuris-scene",
    "crates/yuris-resource",
    "crates/yuris-runtime",
    "crates/yuris-render",
    "crates/yuris-audio",
    "crates/yuris-input",
    "crates/yuris-save",
    "crates/yuris-scenario",
    "crates/yuris-stage",
    "crates/yuris-tools",
    "crates/yuris-debug",
    "crates/yuris-player-core",
    "crates/yuris-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["YurisKernel contributors"]
license = "GPL-3.0-or-later"
repository = ""

[workspace.dependencies]
# --- 通用小依赖 ---
# 热路径哈希表(`insn_cache`:每帧约 70 万次查表)用 FxHash:键是
# `(script_id, offset, len)` 这类整数元组,SipHash 的 DoS 防护在这里纯属开销。
rustc-hash = "2"

# --- internals ---
yuris-core     = { path = "crates/yuris-core" }
yuris-log      = { path = "crates/yuris-log" }
yuris-format   = { path = "crates/yuris-format" }
yuris-value    = { path = "crates/yuris-value" }
yuris-script   = { path = "crates/yuris-script" }
yuris-expr     = { path = "crates/yuris-expr" }
yuris-vm       = { path = "crates/yuris-vm" }
yuris-scene    = { path = "crates/yuris-scene" }
yuris-resource = { path = "crates/yuris-resource" }
yuris-runtime  = { path = "crates/yuris-runtime" }
yuris-render   = { path = "crates/yuris-render" }
yuris-audio    = { path = "crates/yuris-audio" }
yuris-input    = { path = "crates/yuris-input" }
yuris-save     = { path = "crates/yuris-save" }
yuris-scenario = { path = "crates/yuris-scenario" }
yuris-debug    = { path = "crates/yuris-debug" }

# --- externals ---
thiserror          = "2"
encoding_rs        = "0.8"
tracing            = "0.1"
tracing-subscriber = "0.3"
anyhow             = "1"
byteorder          = "1"
flate2             = "1"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
bincode            = "1"
smallvec           = "1"
lru                = "0.12"
clap               = { version = "4", features = ["derive"] }
image              = "0.25"
symphonia          = { version = "0.5", features = ["ogg", "vorbis"] }
wgpu               = "24"
winit              = "0.30"
pollster           = "0.4"
fontdue            = "0.9"
cpal               = "0.15"
bytemuck           = "1"

[profile.release]
opt-level = 3
lto = "thin"
