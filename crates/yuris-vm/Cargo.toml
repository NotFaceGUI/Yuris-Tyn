[package]
name = "yuris-vm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "L3：PC / 值栈 / 调用栈 / 变量区。必须支持 suspend/resume，绝不阻塞。"

[dependencies]
flate2 = { workspace = true }
# 包内条目名是 CP932(SJIS);路径解析要把 UTF-8 字符串翻回 CP932 才能命中
# (成果 135:片头 LOGO 的 `cg\ev\サークル.jpg` 就是被这一点挡住的)。
encoding_rs = { workspace = true }
rustc-hash = { workspace = true }
yuris-core = { workspace = true }
yuris-log = { workspace = true }
yuris-value = { workspace = true }
yuris-script = { workspace = true }
yuris-format = { workspace = true }
# 剧本通道(v555 明文 .txt 运行器 + 统一文本通道;2026-10-17 从 player-core 迁入)
yuris-scenario = { workspace = true }
# 表达式求值由 yuris-script 承担(原 yuris-expr 骨架 crate 已删除;见 PROGRESS.md T27)。
yuris-scene = { workspace = true }
yuris-runtime = { workspace = true }
thiserror = { workspace = true }
